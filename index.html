<!doctype html>
<html lang="ja">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>これいくら？ 身の回りの値段写真集</title>
    <link rel="stylesheet" href="./styles.css">
  </head>
  <body>
    <header class="topbar">
      <div>
        <p class="eyebrow">Price Quiz Photo Book</p>
        <h1>これいくら？ 身の回りの値段写真集</h1>
      </div>
      <div class="actions" aria-label="表示操作">
        <button type="button" id="hideAll">隠す</button>
        <button type="button" id="showAll">答え</button>
        <button type="button" id="printBook">印刷</button>
      </div>
    </header>

    <main>
      <section class="intro" aria-labelledby="intro-title">
        <h2 id="intro-title">見たことはある。でも、値段は知らない。</h2>
        <p>街や店舗、施設の中でよく見かけるけれど、ふだん値段を意識しない業務用・公共用のものを100点集めました。</p>
        <div class="meter" aria-live="polite">
          <span id="revealedCount">0</span><span>/<span id="totalCount">100</span> 件の答えを表示</span>
        </div>
      </section>

      <section class="controls" aria-label="絞り込み">
        <label>
          <span>検索</span>
          <input id="searchInput" type="search" autocomplete="off" placeholder="例: 清掃、カート、発電機">
        </label>
        <label>
          <span>ジャンル</span>
          <select id="categoryFilter">
            <option value="">すべて</option>
          </select>
        </label>
        <p class="visible-count">該当 <span id="visibleCount">100</span>件 / 表示 <span id="renderedCount">0</span>件</p>
      </section>

      <section id="book" class="book" aria-label="写真集"></section>
      <div class="load-more-wrap">
        <button type="button" id="loadMore">さらに表示</button>
      </div>
    </main>

    <footer>
      <p>価格は本体単体の公開販売価格を丸めた目安です。設置工事、保守、送料、消耗品は別です。</p>
      <a href="./research/sources.md">価格・写真ソース</a>
    </footer>

    <script src="./data/items.js"></script>
    <script src="./script.js"></script>
  </body>
</html>
